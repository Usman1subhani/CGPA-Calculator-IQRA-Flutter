name: gpa_calculator_iuic
description: "Independent student GPA and CGPA calculator supporting published Iqra University grading scales."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/play_store_icon.png"
    background_color: "#0D397C"
    theme_color: "#0D397C"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D397C"
  adaptive_icon_foreground: "assets/icon_foreground.png"
